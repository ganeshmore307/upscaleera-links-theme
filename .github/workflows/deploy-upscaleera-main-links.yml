name: Deploy UpscaleEra Main Links Page

on:
  push:
    branches:
      - main
    paths:
      - 'main-site-mu-plugin/**'
      - '.github/workflows/deploy-upscaleera-main-links.yml'
  workflow_dispatch:

concurrency:
  group: upscaleera-main-links-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate main FTP password
        shell: bash
        env:
          MAIN_FTP_PASSWORD: ${{ secrets.MAIN_FTP_PASSWORD }}
        run: |
          if [ -z "$MAIN_FTP_PASSWORD" ]; then
            echo "ERROR: MAIN_FTP_PASSWORD is missing."
            exit 1
          fi

      - name: Detect real WordPress root and deploy MU plugins
        shell: bash
        env:
          MAIN_FTP_PASSWORD: ${{ secrets.MAIN_FTP_PASSWORD }}
        run: |
          set -euo pipefail

          HOST="217.21.89.61"
          AUTH="u868739083:${MAIN_FTP_PASSWORD}"

          ftp_list() {
            local path="$1"
            curl --fail --show-error --silent \
              --ftp-pasv \
              --connect-timeout 20 \
              --max-time 60 \
              --user "$AUTH" \
              --list-only \
              "ftp://${HOST}${path}"
          }

          echo "Checking FTP root..."
          ROOT_LIST="$(ftp_list "/")"
          printf '%s\n' "$ROOT_LIST" | sed -n '1,40p'

          WP_BASE=""

          if printf '%s\n' "$ROOT_LIST" | grep -Eq '^(wp-admin|wp-content|wp-includes|wp-config\.php)$'; then
            WP_BASE="/"
          elif printf '%s\n' "$ROOT_LIST" | grep -qx 'public_html'; then
            echo "Checking /public_html/..."
            PUBLIC_LIST="$(ftp_list "/public_html/")"
            printf '%s\n' "$PUBLIC_LIST" | sed -n '1,40p'
            if printf '%s\n' "$PUBLIC_LIST" | grep -Eq '^(wp-admin|wp-content|wp-includes|wp-config\.php)$'; then
              WP_BASE="/public_html/"
            fi
          fi

          if [ -z "$WP_BASE" ]; then
            echo "ERROR: Could not locate the real WordPress root."
            echo "The workflow will not create guessed/nested public_html folders."
            exit 1
          fi

          echo "Detected WordPress root: ${WP_BASE}"
          DEST="${WP_BASE}wp-content/mu-plugins/"

          for LOCAL_FILE in main-site-mu-plugin/*.php; do
            NAME="$(basename "$LOCAL_FILE")"
            echo "Uploading ${NAME} -> ${DEST}${NAME}"
            curl --fail --show-error --silent \
              --ftp-create-dirs \
              --ftp-pasv \
              --connect-timeout 20 \
              --max-time 120 \
              --user "$AUTH" \
              --upload-file "$LOCAL_FILE" \
              "ftp://${HOST}${DEST}${NAME}"
          done

          echo "Verifying deployed MU plugins..."
          MU_LIST="$(ftp_list "$DEST")"
          printf '%s\n' "$MU_LIST" | sed -n '1,80p'

          for REQUIRED in \
            upscaleera-main-links.php \
            upscaleera-main-links-repair.php \
            upscaleera-links-route-fix.php \
            upscaleera-page1999-force.php \
            zz-upscaleera-main-links-force.php; do
            printf '%s\n' "$MU_LIST" | grep -qx "$REQUIRED" || {
              echo "ERROR: ${REQUIRED} is not present in the live WordPress mu-plugins directory."
              exit 1
            }
          done

          echo "Live WordPress MU plugin deployment verified."

      - name: Deployment complete
        run: echo "UpscaleEra main /links/ deployment completed and verified."
