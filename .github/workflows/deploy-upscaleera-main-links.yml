name: Deploy UpscaleEra Main Links Page

on:
  push:
    branches:
      - main
    paths:
      - 'main-site-mu-plugin/**'
  workflow_dispatch:

concurrency:
  group: upscaleera-main-links-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate main FTP password
        shell: bash
        env:
          MAIN_FTP_PASSWORD: ${{ secrets.MAIN_FTP_PASSWORD }}
        run: |
          if [ -z "$MAIN_FTP_PASSWORD" ]; then
            echo "ERROR: Repository secret MAIN_FTP_PASSWORD is missing."
            echo "Add it at Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          echo "Main FTP password secret is available."

      - name: Upload links MU plugin to upscaleera.com
        shell: bash
        env:
          MAIN_FTP_PASSWORD: ${{ secrets.MAIN_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            --ftp-create-dirs \
            --ftp-pasv \
            --connect-timeout 20 \
            --max-time 120 \
            --user "u868739083:${MAIN_FTP_PASSWORD}" \
            --upload-file "main-site-mu-plugin/upscaleera-main-links.php" \
            "ftp://217.21.89.61/public_html/wp-content/mu-plugins/upscaleera-main-links.php"
          echo "Upload successful."

      - name: Deployment complete
        run: echo "UpscaleEra main /links/ MU plugin deployed successfully."
