name: Deploy UpscaleEra Main Links Page

on:
  push:
    branches:
      - main
    paths:
      - 'main-site-mu-plugin/**'
      - '.github/workflows/deploy-upscaleera-main-links.yml'
  workflow_dispatch:

concurrency:
  group: upscaleera-main-links-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate main FTP password
        shell: bash
        env:
          MAIN_FTP_PASSWORD: ${{ secrets.MAIN_FTP_PASSWORD }}
        run: |
          if [ -z "$MAIN_FTP_PASSWORD" ]; then
            echo "ERROR: MAIN_FTP_PASSWORD is missing."
            exit 1
          fi

      - name: Detect real WordPress root and clean old Links MU plugins
        shell: bash
        env:
          MAIN_FTP_PASSWORD: ${{ secrets.MAIN_FTP_PASSWORD }}
        run: |
          set -euo pipefail

          HOST="217.21.89.61"
          AUTH="u868739083:${MAIN_FTP_PASSWORD}"

          ftp_list() {
            local path="$1"
            curl --fail --show-error --silent \
              --ftp-pasv \
              --connect-timeout 20 \
              --max-time 60 \
              --user "$AUTH" \
              --list-only \
              "ftp://${HOST}${path}" | tr -d '\r'
          }

          ROOT_LIST="$(ftp_list "/")"
          WP_BASE=""

          if printf '%s\n' "$ROOT_LIST" | grep -Eq '^(wp-admin|wp-content|wp-includes|wp-config\.php)$'; then
            WP_BASE="/"
          elif printf '%s\n' "$ROOT_LIST" | grep -qx 'public_html'; then
            PUBLIC_LIST="$(ftp_list "/public_html/")"
            if printf '%s\n' "$PUBLIC_LIST" | grep -Eq '^(wp-admin|wp-content|wp-includes|wp-config\.php)$'; then
              WP_BASE="/public_html/"
            fi
          fi

          if [ -z "$WP_BASE" ]; then
            echo "ERROR: Could not locate the real WordPress root."
            exit 1
          fi

          echo "Detected WordPress root: ${WP_BASE}"
          DEST="${WP_BASE}wp-content/mu-plugins/"

          # Neutralize all previous Links seed/repair/fallback plugins on the live site.
          printf '%s\n' '<?php // Disabled by UpscaleEra Links clean deployment.' > /tmp/ue-disabled.php

          LEGACY_FILES=(
            "000-upscaleera-elementor-manual-mode.php"
            "upscaleera-main-links.php"
            "upscaleera-main-links-repair.php"
            "upscaleera-links-route-fix.php"
            "upscaleera-page1999-force.php"
            "zz-upscaleera-main-links-force.php"
            "zzz-upscaleera-links-fallback.php"
          )

          for NAME in "${LEGACY_FILES[@]}"; do
            echo "Disabling legacy MU plugin: ${NAME}"
            curl --fail --show-error --silent \
              --ftp-create-dirs \
              --ftp-pasv \
              --connect-timeout 20 \
              --max-time 120 \
              --user "$AUTH" \
              --upload-file /tmp/ue-disabled.php \
              "ftp://${HOST}${DEST}${NAME}"
          done

          # Upload only the clean, Elementor-preserving live plugin.
          LIVE_FILE="main-site-mu-plugin/000-upscaleera-links-live.php"
          echo "Uploading clean live plugin..."
          curl --fail --show-error --silent \
            --ftp-create-dirs \
            --ftp-pasv \
            --connect-timeout 20 \
            --max-time 120 \
            --user "$AUTH" \
            --upload-file "$LIVE_FILE" \
            "ftp://${HOST}${DEST}000-upscaleera-links-live.php"

          echo "Verifying live MU plugin folder..."
          MU_LIST="$(ftp_list "$DEST")"
          printf '%s\n' "$MU_LIST" | sed -n '1,100p'
          printf '%s\n' "$MU_LIST" | grep -qx '000-upscaleera-links-live.php' || {
            echo "ERROR: clean live plugin is missing from the real WordPress mu-plugins directory."
            exit 1
          }

          echo "Clean deployment complete. Legacy Links writers are disabled."

      - name: Deployment complete
        run: echo "UpscaleEra /links/ is now Elementor-owned; GitHub no longer overwrites page content."
