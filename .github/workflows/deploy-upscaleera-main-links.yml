name: Deploy UpscaleEra Main Links Page

on:
  push:
    branches:
      - main
    paths:
      - 'main-site-mu-plugin/**'
  workflow_dispatch:

concurrency:
  group: upscaleera-main-links-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate main FTP password
        shell: bash
        env:
          MAIN_FTP_PASSWORD: ${{ secrets.MAIN_FTP_PASSWORD }}
        run: |
          if [ -z "$MAIN_FTP_PASSWORD" ]; then
            echo "ERROR: MAIN_FTP_PASSWORD is missing."
            echo "Create it in Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          echo "MAIN_FTP_PASSWORD is available."

      - name: Test main FTP login
        shell: bash
        env:
          MAIN_FTP_PASSWORD: ${{ secrets.MAIN_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            --ftp-pasv \
            --connect-timeout 20 \
            --max-time 60 \
            --user "u868739083:${MAIN_FTP_PASSWORD}" \
            --list-only \
            "ftp://217.21.89.61/" >/tmp/ftp-root.txt
          echo "FTP login successful."
          echo "FTP root listing:"
          sed -n '1,30p' /tmp/ftp-root.txt

      - name: Upload all Links MU plugin files to upscaleera.com
        shell: bash
        env:
          MAIN_FTP_PASSWORD: ${{ secrets.MAIN_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          AUTH="u868739083:${MAIN_FTP_PASSWORD}"

          upload_to_base() {
            BASE="$1"
            echo "Trying destination: $BASE"
            for LOCAL_FILE in main-site-mu-plugin/*.php; do
              NAME="$(basename "$LOCAL_FILE")"
              echo "Uploading $NAME"
              curl --fail --show-error --silent \
                --ftp-create-dirs --ftp-pasv \
                --connect-timeout 20 --max-time 120 \
                --user "$AUTH" \
                --upload-file "$LOCAL_FILE" \
                "ftp://217.21.89.61${BASE}${NAME}" || return 1
            done
            return 0
          }

          if upload_to_base "/public_html/wp-content/mu-plugins/"; then
            echo "All MU plugin files uploaded using /public_html/wp-content/mu-plugins/."
            exit 0
          fi

          echo "First path failed. Trying FTP-rooted /wp-content/mu-plugins/."
          if upload_to_base "/wp-content/mu-plugins/"; then
            echo "All MU plugin files uploaded using /wp-content/mu-plugins/."
            exit 0
          fi

          echo "ERROR: FTP login worked, but neither destination accepted all MU plugin files."
          exit 1

      - name: Deployment complete
        run: echo "UpscaleEra main /links/ MU plugins deployed successfully."
