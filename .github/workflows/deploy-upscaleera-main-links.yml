name: Deploy UpscaleEra Main Links Page

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'main-site-mu-plugin/**'
      - '.github/workflows/deploy-upscaleera-main-links.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required FTP secrets
        shell: bash
        env:
          MAIN_FTP_SERVER: ${{ secrets.MAIN_FTP_SERVER }}
          MAIN_FTP_USERNAME: ${{ secrets.MAIN_FTP_USERNAME }}
          MAIN_FTP_PASSWORD: ${{ secrets.MAIN_FTP_PASSWORD }}
        run: |
          set -e
          test -n "$MAIN_FTP_SERVER" || { echo "MAIN_FTP_SERVER is missing"; exit 1; }
          test -n "$MAIN_FTP_USERNAME" || { echo "MAIN_FTP_USERNAME is missing"; exit 1; }
          test -n "$MAIN_FTP_PASSWORD" || { echo "MAIN_FTP_PASSWORD is missing"; exit 1; }

      - name: Upload links MU plugin to upscaleera.com
        shell: bash
        env:
          MAIN_FTP_SERVER: ${{ secrets.MAIN_FTP_SERVER }}
          MAIN_FTP_USERNAME: ${{ secrets.MAIN_FTP_USERNAME }}
          MAIN_FTP_PASSWORD: ${{ secrets.MAIN_FTP_PASSWORD }}
        run: |
          set -e
          curl --fail --show-error --silent \
            --ftp-create-dirs \
            --ftp-pasv \
            --user "$MAIN_FTP_USERNAME:$MAIN_FTP_PASSWORD" \
            --upload-file "main-site-mu-plugin/upscaleera-main-links.php" \
            "ftp://$MAIN_FTP_SERVER/public_html/wp-content/mu-plugins/upscaleera-main-links.php"

      - name: Deployment complete
        run: echo "UpscaleEra main /links/ MU plugin uploaded successfully."
